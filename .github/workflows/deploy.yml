name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Code Quality & Linting
        run: npm run lint

      - name: Unit & Integration Tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify build integrity
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html || {
            echo "::error::Missing dist/index.html"
            exit 1
          }

          test -f dist/404.html || {
            echo "::error::Missing dist/404.html"
            exit 1
          }

          test -f dist/.nojekyll || {
            echo "::error::Missing dist/.nojekyll"
            exit 1
          }

          test -f dist/sitemap.xml || {
            echo "::error::Missing dist/sitemap.xml"
            exit 1
          }

          test -f dist/robots.txt || {
            echo "::error::Missing dist/robots.txt"
            exit 1
          }

          test -f dist/projects/index.html || {
            echo "::error::Missing dist/projects/index.html"
            exit 1
          }

          echo "All required build files verified."

      - name: Generate Deployment Summary
        shell: bash
        run: |
          DIST_SIZE=$(du -sh dist | awk '{print $1}')
          JS_COUNT=$(find dist/assets -type f -name '*.js' 2>/dev/null | wc -l | tr -d ' ')
          CSS_COUNT=$(find dist/assets -type f -name '*.css' 2>/dev/null | wc -l | tr -d ' ')

          {
            echo "## GitHub Pages Build Summary"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Build status | Passed |"
            echo "| Bundle size | ${DIST_SIZE} |"
            echo "| JavaScript files | ${JS_COUNT} |"
            echo "| CSS files | ${CSS_COUNT} |"
            echo "| Deployment URL | https://ravindra121q.github.io/ |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
