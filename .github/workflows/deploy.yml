name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality-and-build:
    name: Quality Gate & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Code Quality & Linting (oxlint)
        run: npm run lint

      - name: Unit & Integration Tests (vitest)
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify build artifacts & SPA routes
        run: |
          set -euo pipefail
          echo "Verifying production build integrity..."
          test -f dist/index.html || { echo "::error::Missing dist/index.html"; exit 1; }
          test -f dist/404.html || { echo "::error::Missing dist/404.html (required for SPA routing)"; exit 1; }
          test -f dist/.nojekyll || { echo "::error::Missing dist/.nojekyll"; exit 1; }
          test -f dist/sitemap.xml || { echo "::error::Missing dist/sitemap.xml"; exit 1; }
          test -f dist/robots.txt || { echo "::error::Missing dist/robots.txt"; exit 1; }
          test -d dist/projects && test -f dist/projects/index.html || { echo "::error::Missing dist/projects/index.html"; exit 1; }
          echo "✓ All critical GitHub Pages files & SPA routes verified."

      - name: Generate Deployment Step Summary
        run: |
          DIST_SIZE=$(du -sh dist | awk '{print $1}')
          JS_COUNT=$(find dist/assets -name '*.js' | wc -l | tr -d ' ')
          CSS_COUNT=$(find dist/assets -name '*.css' | wc -l | tr -d ' ')
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## 🚀 GitHub Pages Build Summary

          | Metric | Value |
          |---|---|
          | **Status** | ✅ Passed Quality Gate & Built Successfully |
          | **Total Bundle Size** | ${DIST_SIZE} |
          | **JavaScript Chunks** | ${JS_COUNT} |
          | **CSS Bundles** | ${CSS_COUNT} |
          | **SPA Fallback** | ✅ \`404.html\` + Pre-rendered Route Index Files |
          | **Jekyll Processing** | ⛔ Disabled (\`.nojekyll\` present) |
          | **Live URL Target** | [https://ravindra121q.github.io/](https://ravindra121q.github.io/) |

          ### 📦 Pre-rendered 200 OK Routes
          - \`/\` (Home)
          - \`/projects\`
          - \`/services\`
          - \`/about\`
          - \`/contact\`
          - \`/help\`
          - \`/privacy\`
          - \`/terms\`
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy-actions:
    name: Deploy to GitHub Pages (Actions)
    needs: quality-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-branch:
    name: Deploy to gh-pages Branch (Dual-Deployment Support)
    needs: quality-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false
          enable_jekyll: false
          commit_message: "chore(release): deploy ${{ github.sha }} to gh-pages [skip ci]"
